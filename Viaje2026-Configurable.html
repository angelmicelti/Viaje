<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>MiViaje - Planificador de Ruta</title>
    <meta name="description" content="Tu viaje organizado en un solo lugar">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        // Aplicar el tema (día/noche) del dispositivo antes del primer render para evitar parpadeos
        (function () {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 40%, #020617 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* ---- Editable fields ---- */
        [data-editable] { cursor: default; transition: outline 0.15s, background 0.15s; border-radius: 6px; }
        .edit-mode [data-editable] {
            outline: 1px dashed rgba(96,165,250,0.4);
            outline-offset: 2px;
            cursor: text;
        }
        .edit-mode [data-editable]:hover {
            outline-color: rgba(96,165,250,0.8);
            background: rgba(30,58,138,0.15);
        }
        .edit-input {
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(96,165,250,0.6);
            border-radius: 6px;
            padding: 4px 8px;
            color: #e2e8f0;
            font: inherit;
            width: 100%;
            outline: none;
        }
        .edit-input:focus { border-color: #60a5fa; }
        textarea.edit-input { resize: vertical; min-height: 60px; }

        /* ---- Buttons ---- */
        .btn-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px;
            border: none; cursor: pointer; transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-add {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 24px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #94a3b8; cursor: pointer; transition: all 0.2s;
            min-height: 180px;
            background: transparent;
            width: 100%;
        }
        .btn-add:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
        .btn-delete {
            background: rgba(239,68,68,0.15); color: #f87171;
        }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }

        /* ---- Sync indicator ---- */
        .sync-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 6px;
        }
        .sync-dot.saved { background: #4ade80; }
        .sync-dot.saving { background: #facc15; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ---- Tab visibility toggle ---- */
        .tab-vis { accent-color: #60a5fa; width: 18px; height: 18px; cursor: pointer; }

        /* ==================================================================
           TEMA DÍA (automático: html.light-mode cuando el dispositivo usa esquema claro)
           ================================================================== */
        :root { color-scheme: dark; }
        html.light-mode { color-scheme: light; }
        html.light-mode body {
            background-color: #f1f5f9;
            background-image: radial-gradient(circle at top right, #dbeafe 0%, #f1f5f9 45%, #e2e8f0 100%);
        }

        /* Texto */
        html.light-mode .text-white { color: #0f172a; }
        html.light-mode .bg-blue-600.text-white,
        html.light-mode .bg-blue-600\/80.text-white { color: #ffffff; }
        html.light-mode .text-slate-200 { color: #334155; }
        html.light-mode .text-slate-300 { color: #475569; }
        html.light-mode .text-slate-400 { color: #64748b; }
        html.light-mode .text-slate-500 { color: #94a3b8; }
        html.light-mode .text-blue-200 { color: #1d4ed8; }
        html.light-mode .text-blue-300 { color: #1d4ed8; }
        html.light-mode .text-blue-400 { color: #2563eb; }
        html.light-mode .text-amber-300 { color: #b45309; }
        html.light-mode .text-amber-400 { color: #d97706; }
        html.light-mode .text-cyan-400 { color: #0e7490; }
        html.light-mode .text-emerald-300 { color: #047857; }
        html.light-mode .text-emerald-400 { color: #059669; }
        html.light-mode .text-orange-400 { color: #ea580c; }
        html.light-mode .text-purple-300 { color: #7e22ce; }
        html.light-mode .text-purple-400 { color: #7c3aed; }
        html.light-mode .text-red-400 { color: #dc2626; }
        html.light-mode .text-yellow-300 { color: #b45309; }
        html.light-mode .text-yellow-400 { color: #ca8a04; }
        html.light-mode .hover\:text-slate-200:hover { color: #334155; }
        html.light-mode .hover\:text-white:hover { color: #0f172a; }
        html.light-mode .hover\:text-blue-300:hover { color: #1d4ed8; }
        html.light-mode .hover\:text-emerald-300:hover { color: #047857; }
        html.light-mode .hover\:text-red-300:hover { color: #dc2626; }

        /* Fondos */
        html.light-mode .bg-white\/5 { background-color: rgba(255,255,255,0.72); }
        html.light-mode .bg-black\/30 { background-color: rgba(15,23,42,0.05); }
        html.light-mode .bg-slate-900\/80 { background-color: rgba(255,255,255,0.85); }
        html.light-mode .bg-slate-900\/60 { background-color: rgba(15,23,42,0.35); }
        html.light-mode .bg-slate-900\/50 { background-color: rgba(241,245,249,0.9); }
        html.light-mode .bg-slate-800 { background-color: #ffffff; }
        html.light-mode .bg-slate-800\/80 { background-color: rgba(255,255,255,0.9); }
        html.light-mode .bg-slate-700 { background-color: #e2e8f0; }
        html.light-mode .bg-amber-900\/20 { background-color: rgba(251,191,36,0.18); }
        html.light-mode .bg-amber-900\/40 { background-color: rgba(251,191,36,0.25); }
        html.light-mode .bg-purple-900\/40 { background-color: rgba(216,180,254,0.30); }
        html.light-mode .bg-blue-600\/20 { background-color: rgba(59,130,246,0.12); }
        html.light-mode .hover\:bg-white\/10:hover { background-color: rgba(15,23,42,0.06); }
        html.light-mode .hover\:bg-slate-800:hover { background-color: #f1f5f9; }
        html.light-mode .hover\:bg-slate-600:hover { background-color: #cbd5e1; }

        /* Bordes y separadores */
        html.light-mode .border-white\/10 { border-color: rgba(15,23,42,0.10); }
        html.light-mode .border-white\/5 { border-color: rgba(15,23,42,0.07); }
        html.light-mode .border-slate-600 { border-color: #cbd5e1; }
        html.light-mode .border-slate-700\/50 { border-color: rgba(15,23,42,0.12); }
        html.light-mode .divide-white\/5 > :not([hidden]) ~ :not([hidden]) { border-color: rgba(15,23,42,0.08); }

        /* Tarjetas de Inicio (degradados) */
        html.light-mode .bg-gradient-to-br.from-blue-900\/50 { background-image: linear-gradient(to bottom right, rgba(191,219,254,0.55), rgba(255,255,255,0.75)); }
        html.light-mode .bg-gradient-to-br.from-emerald-900\/50 { background-image: linear-gradient(to bottom right, rgba(167,243,208,0.55), rgba(255,255,255,0.75)); }
        html.light-mode .bg-gradient-to-br.from-purple-900\/50 { background-image: linear-gradient(to bottom right, rgba(216,180,254,0.55), rgba(255,255,255,0.75)); }

        /* Estilos propios de la app */
        html.light-mode .edit-input { background: #ffffff; border-color: #cbd5e1; color: #1e293b; }
        html.light-mode .edit-input:focus { border-color: #3b82f6; }
        html.light-mode .edit-mode [data-editable]:hover { background: rgba(59,130,246,0.10); }
        html.light-mode .btn-add { color: #64748b; border-color: rgba(15,23,42,0.25); }
        html.light-mode .btn-add:hover { color: #0f172a; border-color: rgba(15,23,42,0.45); }

        /* ==================================================================
           EXPORTACIÓN A PDF (A4) — documento de impresión
           ================================================================== */
        @page { size: A4; margin: 12mm 13mm; }
        #print-root { display: none; }
        #print-root h1 { font-size: 20pt; margin: 0 0 1.5mm; color: #0f172a; }
        #print-root .pdf-label { color: #1d4ed8; }
        #print-root .pdf-sub { font-size: 11pt; color: #334155; margin: 0 0 1.5mm; }
        #print-root .pdf-desc { font-size: 9.5pt; color: #475569; margin: 0 0 2mm; }
        #print-root .pdf-meta { display: flex; justify-content: space-between; font-size: 8.5pt; color: #64748b; text-transform: uppercase; letter-spacing: 0.5mm; border-bottom: 1.5pt solid #1d4ed8; padding-bottom: 2mm; margin-bottom: 4mm; }
        #print-root h2 { font-size: 12.5pt; color: #1d4ed8; margin: 6mm 0 2.5mm; border-bottom: 0.75pt solid #cbd5e1; padding-bottom: 1mm; break-after: avoid; }
        #print-root table { width: 100%; border-collapse: collapse; font-size: 9.5pt; color: #111827; }
        #print-root th { background: #e2e8f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; text-align: left; padding: 1.6mm 2mm; border-bottom: 0.75pt solid #94a3b8; }
        #print-root td { padding: 1.6mm 2mm; border-bottom: 0.5pt solid #e2e8f0; vertical-align: top; }
        #print-root thead { display: table-header-group; }
        #print-root tr { break-inside: avoid; }
        #print-root .pdf-chain { font-size: 10.5pt; color: #0f172a; }
        #print-root .pdf-card { border: 0.75pt solid #cbd5e1; border-left: 2.5pt solid #f59e0b; border-radius: 1.5mm; padding: 2.5mm 3mm; margin-bottom: 2.5mm; break-inside: avoid; }
        #print-root .pdf-card h3 { margin: 0 0 1mm; font-size: 11pt; color: #0f172a; }
        #print-root .pdf-line { font-size: 9.5pt; margin: 0.6mm 0; color: #1f2937; }
        #print-root .pdf-note { font-size: 8.8pt; color: #333333; background: #fef3c7; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 1.8mm; border-radius: 1mm; margin-top: 1.5mm; }
        #print-root .pdf-total { text-align: right; font-size: 10pt; font-weight: 600; color: #0f172a; margin: 1.5mm 0 0; }
        @media print {
            body > *:not(#print-root) { display: none !important; }
            #print-root { display: block !important; }
            html, body { background: #ffffff !important; background-image: none !important; }
        }

        /* ==================================================================
           RESPONSIVO / MULTIPLATAFORMA (móvil primero, táctil, safe areas)
           ================================================================== */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { -webkit-tap-highlight-color: transparent; }
        /* Zonas seguras (notch y barra inferior de iPhone; barra de tareas de Android) */
        #fab-home { bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); right: calc(1.5rem + env(safe-area-inset-right, 0px)); }
        #pdf-toast { bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
        /* Altura del mapa: dvh corrige el vh de iOS Safari (barra del navegador) */
        .map-h { height: 70vh; height: 70dvh; }
        @media (min-width: 640px) { .map-h { height: 80vh; height: 80dvh; } }
        /* En pantallas táctiles: objetivos cómodos de 44px y sin zoom automático de iOS */
        @media (pointer: coarse) {
            .btn-icon { width: 44px; height: 44px; }
            .nav-tab { padding-top: 0.65rem !important; padding-bottom: 0.65rem !important; }
            #btn-edit-toggle { padding-top: 0.65rem; padding-bottom: 0.65rem; }
            .edit-input { font-size: 16px !important; }
            .tab-vis { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

    <!-- ============ NAVBAR ============ -->
    <nav class="bg-slate-900/80 backdrop-blur-xl border-b border-slate-700/50 sticky top-0 z-40 shadow-lg" style="padding-top: env(safe-area-inset-top, 0px);">
        <div class="max-w-5xl mx-auto px-3 sm:px-6">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1 py-1 md:py-0 md:h-16">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="switchTab('home')">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>
                    <span id="nav-appname" data-editable="config.appName" class="ml-2 font-bold text-white text-lg tracking-tight hidden xl:block">MiViaje</span>
                </div>
                <div class="flex items-center gap-1 sm:gap-2 flex-1 min-w-0 md:flex-none ml-auto md:ml-0">
                    <select id="trip-select" onchange="switchTrip(this.value)" title="Cambiar de viaje" class="bg-slate-800/80 border border-slate-600 text-slate-200 text-xs sm:text-sm rounded-lg px-2 py-2 min-w-0 flex-1 md:flex-none max-w-[220px] md:max-w-[240px] focus:outline-none focus:border-blue-400"></select>
                    <button id="btn-new-trip" onclick="openNewTripModal()" title="Nuevo viaje" class="btn-icon bg-blue-600/80 hover:bg-blue-500 text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                    <button id="btn-export-pdf" onclick="exportTripToPdf()" title="Exportar este viaje a PDF (A4)" class="btn-icon bg-slate-800/80 border border-slate-600 hover:border-blue-400 text-slate-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                    </button>
                    <button id="btn-del-trip" onclick="deleteActiveTrip()" title="Eliminar este viaje" class="btn-icon btn-delete hidden">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
                <div id="nav-tabs" class="order-last w-full md:order-none md:w-auto flex space-x-1 md:space-x-4 overflow-x-auto no-scrollbar min-w-0 border-t border-slate-700/40 md:border-0 pt-1 pb-2 md:pb-0"></div>
                <button id="btn-edit-toggle" onclick="toggleEditMode()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    <span class="hidden sm:inline">Editar</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ============ EDIT BANNER ============ -->
    <div id="edit-banner" class="hidden bg-blue-600/20 border-b border-blue-500/30 px-4 py-2 text-center">
        <p class="text-blue-300 text-sm">
            <span class="sync-dot saved" id="sync-dot"></span>
            Modo edición activo — haz clic en cualquier texto resaltado para editarlo. Los cambios se guardan en Firebase.
        </p>
        <div class="flex justify-center gap-4 mt-1">
            <button onclick="refreshLiveData()" class="text-xs text-blue-400 hover:text-blue-300 underline">Refrescar Clima/Rutas</button>
            <button onclick="resetToDefaults()" class="text-xs text-red-400 hover:text-red-300 underline">Restaurar originales</button>
        </div>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="flex-grow w-full max-w-5xl mx-auto p-4 sm:p-6 lg:p-8" id="main-content">
        <!-- Dynamic content rendered by JS -->
    </main>

    <!-- ============ FLOATING HOME BTN ============ -->
    <button id="fab-home" onclick="switchTab('home')" class="fixed bottom-6 right-6 z-40 bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-full shadow-2xl transition-all duration-300 hover:scale-110 hidden">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </button>

    <!-- ============ WEATHER MODAL ============ -->
    <div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-md max-h-[86dvh] overflow-y-auto p-6 md:p-8" id="modal-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-2 rounded-full hover:bg-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="text-center mb-6">
                <h3 id="modal-location" class="text-2xl font-bold text-white mb-1"></h3>
                <p id="modal-date" class="text-blue-400 font-medium"></p>
            </div>
            <div class="space-y-4">
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50 flex items-center justify-between">
                    <div class="flex items-center space-x-3 text-slate-300">
                        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18v3m0 0l-2-2m2 2l2-2"/></svg>
                        <span class="font-medium">Prob. Precipitación</span>
                    </div>
                    <span id="modal-pop" class="text-lg font-bold text-white"></span>
                </div>
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50 flex items-center justify-between">
                    <div class="flex items-center space-x-3 text-slate-300">
                        <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        <span class="font-medium">Viento</span>
                    </div>
                    <span id="modal-wind" class="text-lg font-bold text-white"></span>
                </div>
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                    <p id="modal-desc" class="text-slate-400 text-sm leading-relaxed"></p>
                </div>
            </div>
            <div class="mt-8 text-center">
                <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition-colors">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- ============ EXPORT PDF (A4) ============ -->
    <div id="print-root"></div>
    <div id="pdf-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-blue-600 text-white px-4 py-2 rounded-xl shadow-2xl text-sm font-medium hidden"></div>

    <!-- ============ NEW TRIP MODAL ============ -->
    <div id="newtrip-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeNewTripModal()"></div>

/* ======================================================================

function uid() { return Math.random().toString(36).slice(2, 10); }

function saveDot(obj, path, val) {
    const keys = path.split('.');
    const last = keys.pop();
    let cur = obj;
    for (const k of keys) { if (!(k in cur)) cur[k] = {}; cur = cur[k]; }
    cur[last] = val;
}

function getDot(obj, path) {
    const keys = path.split('.');
    let cur = obj;
    for (const k of keys) { if (cur == null) return undefined; cur = cur[k]; }
    return cur;
}

function showSyncSaving() {
    const dot = document.getElementById('sync-dot');
    if (dot) { dot.className = 'sync-dot saving'; }
}
function showSyncSaved() {
    const dot = document.getElementById('sync-dot');
    if (dot) { dot.className = 'sync-dot saved'; }
}

function saveToFirebase() {
    if (!App.activeTripId) return;
    showSyncSaving();
    db.ref(ROOT).update({ ['trips/' + App.activeTripId + '/data']: S, activeTripId: App.activeTripId })
        .then(() => showSyncSaved())
        .catch(e => console.error('Firebase save error', e));
}

function isoLocal(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function eachDay(start, end) {
    const out = [];
    if (!start || !end || end < start) return out;
    const d = new Date(start + 'T00:00:00');
    const e = new Date(end + 'T00:00:00');
    for (let i = 0; i < 365 && d <= e; i++) { out.push(isoLocal(d)); d.setDate(d.getDate() + 1); }
    return out;
}

function monthsLabel(start, end) {
    if (!start || !end) return '';
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const ma = cap(new Date(start + 'T00:00:00').toLocaleDateString('es-ES', { month: 'long' }));
    const mb = cap(new Date(end + 'T00:00:00').toLocaleDateString('es-ES', { month: 'long' }));
    const y = new Date(end + 'T00:00:00').getFullYear();
    return ma === mb ? `${ma} ${y}` : `${ma} - ${mb} ${y}`;
}

function defaultTripData(name, start, end) {

}

function normalizeTripData(data) {
    const d = data || {};
    if (!Array.isArray(d.accommodations)) d.accommodations = Object.values(d.accommodations || {});
    if (!Array.isArray(d.reservations)) d.reservations = Object.values(d.reservations || {});
    if (!Array.isArray(d.travelPlan)) d.travelPlan = Object.values(d.travelPlan || {});
    if (!d.locations) d.locations = {};
    if (!d.config) d.config = {};
    if (!Array.isArray(d.config.tabs)) d.config.tabs = Object.values(d.config.tabs || {});
    if (!Array.isArray(d.config.homeCards)) d.config.homeCards = Object.values(d.config.homeCards || {});
    return d;
}

function normalizeTrip(t) {
    return { id: t.id || 'v-' + uid(), createdAt: t.createdAt || '', startDate: t.startDate || '', endDate: t.endDate || '', source: t.source || '', data: normalizeTripData(t.data) };
}

function getActiveTrip() {
    return App.trips.find(t => t.id === App.activeTripId) || null;
}

function applyActiveTrip() {
    const t = getActiveTrip() || App.trips[0];
    if (!t) return;
    App.activeTripId = t.id;
    if (t.id !== lastTripId) {
        lastTripId = t.id;
        weatherFetched = false; routesFetched = false;
        forecastData = []; routeLegs = [];
    }
    S = t.data;
}

function buildLegacyTrip(data, startDate, endDate) {
    return { id: 'v-' + uid(), createdAt: new Date().toISOString(), startDate: startDate || '', endDate: endDate || '', source: 'legacy', data: normalizeTripData(data) };
}

function loadFromFirebase(cb) {
    db.ref(ROOT).on('value', snap => {
        const d = snap.val();
        if (!d) {
            // Primera vez: sembrar el viaje de ejemplo completo
            const dates = DEFAULTS.travelPlan.map(t => t.date).filter(Boolean).sort();
            const trip = buildLegacyTrip(JSON.parse(JSON.stringify(DEFAULTS)), dates[0], dates[dates.length - 1]);
            db.ref(ROOT).set({ trips: { [trip.id]: trip }, activeTripId: trip.id });
            return;
        }
        if (d.trips) {
            App.trips = Object.values(d.trips).map(normalizeTrip)
                .sort((a, b) => (a.startDate || '9999').localeCompare(b.startDate || '9999') || (a.createdAt || '').localeCompare(b.createdAt || ''));
            if (!App.trips.length) return;
            App.activeTripId = App.trips.some(t => t.id === d.activeTripId) ? d.activeTripId : App.trips[0].id;
            applyActiveTrip();
            cb();
        } else {
            // Migración desde la estructura antigua (datos sueltos en la raíz)
            const data = { config: d.config, locations: d.locations, accommodations: d.accommodations, reservations: d.reservations, travelPlan: d.travelPlan };
            const dates = (d.travelPlan ? Object.values(d.travelPlan).map(t => t && t.date).filter(Boolean) : []).sort();
            const trip = buildLegacyTrip(data, dates[0], dates[dates.length - 1]);
            db.ref(ROOT).update({ ['trips/' + trip.id]: trip, activeTripId: trip.id, config: null, locations: null, accommodations: null, reservations: null, travelPlan: null });
            return;
        }
    }, err => {
        console.error('Firebase: error de acceso (permisos o conexión):', err);
        const lt = document.getElementById('loading-text');
        if (lt) lt.innerHTML = '⚠ Sin permiso para leer los datos.<br><span class="text-xs">Comprueba que la autenticación anónima esté activa en Firebase y que las reglas del nodo <b>viajePlanner</b> permitan el acceso a usuarios autenticados (ver REGLAS-FIREBASE.md).</span>';
    });
}

/* ======================================================================
   EDITABLE SYSTEM
   ====================================================================== */
function makeEditable(el, path, multiline) {
    el.addEventListener('click', function handler(e) {
        if (!editMode) return;
        e.stopPropagation();
        const oldVal = getDot(S, path);
        const tag = multiline ? 'textarea' : 'input';
        const input = document.createElement(tag);
        input.className = 'edit-input';
        input.value = oldVal;
        if (el.tagName === 'H1' || el.closest('h1')) input.style.fontSize = '0.65em';
        el.replaceWith(input);
        input.focus();
        input.select();

        function commit() {
            const newVal = input.value.trim() || oldVal;
            saveDot(S, path, newVal);
            saveToFirebase();
            const span = document.createElement(el.tagName || 'span');
            span.setAttribute('data-editable', path);
            span.textContent = newVal;
            if (el.className) span.className = el.className;
            input.replaceWith(span);
            makeEditable(span, path, multiline);
        }
        input.addEventListener('blur', commit);
        if (!multiline) input.addEventListener('keydown', e2 => { if (e2.key === 'Enter') { e2.preventDefault(); commit(); } });
    });
}

function initEditables() {
    document.querySelectorAll('[data-editable]').forEach(el => {
        if (el.__editableBound) return;
        el.__editableBound = true;
        const path = el.getAttribute('data-editable');
        const isMultiline = el.tagName === 'P' || el.hasAttribute('data-multiline');
        makeEditable(el, path, isMultiline);
    });
}

/* ======================================================================
   TAB NAVIGATION
   ====================================================================== */
function switchTab(id) {
    activeTab = id;
    renderTabs();
    renderView();
    const fab = document.getElementById('fab-home');
    if (id === 'home') fab.classList.add('hidden'); else fab.classList.remove('hidden');
    if (id === 'weather' && !weatherFetched) { weatherFetched = true; fetchWeather(); }
    if (id === 'routes' && !routesFetched) { routesFetched = true; fetchRoutes(); }
}

function renderTabs() {
    const c = document.getElementById('nav-tabs');
    c.innerHTML = '';
    S.config.tabs.filter(t => t.visible).forEach(tab => {
        const btn = document.createElement('button');
        const isActive = activeTab === tab.id;
        btn.className = `nav-tab flex items-center px-3 py-2 text-sm font-medium transition-colors whitespace-nowrap ${isActive ? 'text-blue-400 border-b-2 border-blue-400' : 'text-slate-400 hover:text-slate-200'}`;
        btn.innerHTML = `<span class="mr-1.5">${ICO[tab.icon] || ICO.home}</span><span>${esc(tab.label)}</span>`;
        btn.onclick = () => switchTab(tab.id);
        c.appendChild(btn);
    });
}

}

/* ---------- WEATHER ---------- */
function getWeatherDesc(code) {
    const d = {0:'Despejado',1:'Poco nublado',2:'Nubes parciales',3:'Nublado',45:'Niebla',51:'Llovizna',61:'Lluvia',80:'Chubascos',95:'Tormenta'};
    return d[code] || 'Variable';
}
function getWeatherIcon(condition) {
    const c = condition.toLowerCase();
    if (c.includes('despejado') || c.includes('poco')) return '<svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>';
    if (c.includes('lluv') || c.includes('chub')) return '<svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18v3m0 0l-2-2m2 2l2-2"/></svg>';
    return ICO.cloud;
}

async function fetchWeather() {
    const uniqueLocs = [...new Set(S.travelPlan.map(i => i.location))].filter(Boolean);
    const cache = {};
    for (const loc of uniqueLocs) {
        const coord = S.locations[loc];
        if (!coord) continue;
        try {
            const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord.lat}&longitude=${coord.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=Europe%2FMadrid&forecast_days=16`);
            if (r.ok) { const j = await r.json(); if (j.daily) cache[loc] = j.daily; }
            await new Promise(r2 => setTimeout(r2, 300));
        } catch(e) { console.error(e); }
    }
    forecastData = S.travelPlan.map(item => {
        const data = cache[item.location];
        if (!data) return { location: item.location, date: item.date, min: '--', max: '--', pop: 0, wind: '--', condition: 'Sin datos' };
        const idx = data.time.indexOf(item.date);
        if (idx !== -1) {
            const tmin = data.temperature_2m_min[idx], tmax = data.temperature_2m_max[idx];
            const pop = data.precipitation_probability_max[idx];
            const wsp = data.windspeed_10m_max[idx];
            return {
                location: item.location, date: item.date,
                min: tmin == null ? '--' : Math.round(tmin),
                max: tmax == null ? '--' : Math.round(tmax),
                pop: pop == null ? 0 : pop,
                wind: wsp == null ? '--' : Math.round(wsp) + ' km/h',
                condition: getWeatherDesc(data.weathercode[idx])
            };
        }
        return { location: item.location, date: item.date, min: '--', max: '--', pop: 0, wind: '--', condition: 'Fuera de alcance' };
    });
    if (activeTab === 'weather') renderView();
}

function viewWeather() {
    if (S.travelPlan.length === 0) return '<div class="text-center py-10"><p class="text-slate-400">Añade días a tu plan de viaje (modo edición) para ver la previsión.</p></div>';

    const rows = forecastData.map((d, i) => {

            <td class="py-4 px-4 sm:px-6 whitespace-nowrap text-slate-300">${fmt}</td>

    <div class="bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl rounded-2xl overflow-hidden"><div class="overflow-x-auto no-scrollbar"><table class="w-full text-left border-collapse"><thead><tr class="bg-black/30 border-b border-white/10 text-xs sm:text-sm uppercase tracking-wider text-slate-300"><th class="py-4 px-4 sm:px-6 font-semibold">Fecha</th><th class="py-4 px-4 sm:px-6 font-semibold">Localidad</th><th class="py-4 px-4 sm:px-6 font-semibold hidden sm:table-cell">Estado</th><th class="py-4 px-4 sm:px-6 font-semibold text-center">T. Mín</th><th class="py-4 px-4 sm:px-6 font-semibold text-center">T. Máx</th></tr></thead><tbody class="divide-y divide-white/5 text-sm sm:text-base">${rows}</tbody></table></div></div></div>`;

function openModal(i) {

/* ---------- ROUTES ---------- */
let routesInFlight = null;
async function fetchRoutes() {
    // Una sola ejecución a la vez (pestaña Rutas y exportar PDF pueden pedirla a la vez)
    if (routesInFlight) return routesInFlight;
    routesInFlight = (async () => {
        // Etapas reales: cada cambio de localidad en el plan (incluye el regreso al origen)
        const stops = [];
        S.travelPlan.forEach(d => { if (d.location && stops[stops.length - 1] !== d.location) stops.push(d.location); });
        routeLegs = [];
        for (let i = 0; i < stops.length - 1; i++) {
            const c1 = S.locations[stops[i]], c2 = S.locations[stops[i+1]];
            let dist = '-- km', dur = '--';
            if (c1 && c2) {
                try {
                    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1.lon},${c1.lat};${c2.lon},${c2.lat}?overview=false`);
                    const j = await r.json();
                    if (j.code === 'Ok' && j.routes.length) {
                        dist = (j.routes[0].distance/1000).toFixed(0)+' km';
                        const s = j.routes[0].duration; const h = Math.floor(s/3600); const m = Math.round((s%3600)/60); dur = h+'h '+m+'m';
                    }
                } catch(e) { console.error(e); }
            }
            routeLegs.push({from:stops[i], to:stops[i+1], distance:dist, duration:dur});
        }
        if (activeTab === 'routes') renderView();
    })();
    try { await routesInFlight; } finally { routesInFlight = null; }
}

function viewRoutes() {
    const stopsNow = [];
    S.travelPlan.forEach(d => { if (d.location && stopsNow[stopsNow.length - 1] !== d.location) stopsNow.push(d.location); });
    if (stopsNow.length < 2) return '<div class="text-center py-10"><p class="text-slate-400">Asigna localidades a tu plan de viaje (modo edición) para calcular rutas entre etapas.</p></div>';
    if (routeLegs.length === 0) return '<div class="text-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-400 mx-auto mb-4"></div><p class="text-slate-400">Calculando distancias...</p></div>';
    const cards = routeLegs.map((l,i) => {
        const c1 = S.locations[l.from], c2 = S.locations[l.to];
        if (!c1 || !c2) return '';   // localidad eliminada después de calcular: se omite la etapa
        return `<div class="bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between shadow-lg fade-in cursor-pointer hover:border-emerald-400/50 transition-colors" style="animation-delay:${i*0.1}s" onclick="window.open('https://www.google.com/maps/dir/?api=1&origin=${c1?.lat},${c1?.lon}&destination=${c2?.lat},${c2?.lon}&travelmode=driving','_blank')">
            <div class="flex items-center w-full sm:w-auto mb-4 sm:mb-0">
                <div class="flex flex-col items-center sm:items-start"><span class="text-xl font-bold text-white">${esc(l.from)}</span><span class="text-xs text-slate-500 uppercase tracking-wider">Origen</span></div>
                <div class="px-4 sm:px-8 flex-grow flex justify-center"><div class="flex flex-col items-center"><span class="text-emerald-400 mb-1">${ICO.arrow}</span><span class="text-emerald-300 text-sm font-semibold">${l.distance}</span></div></div>
                <div class="flex flex-col items-center sm:items-end"><span class="text-xl font-bold text-white">${esc(l.to)}</span><span class="text-xs text-slate-500 uppercase tracking-wider">Destino</span></div>
            </div>
            <div class="bg-slate-900/50 rounded-xl px-4 py-2 flex items-center space-x-2 border border-slate-700/50 w-full sm:w-auto justify-center"><span class="text-slate-400">${ICO.clock}</span><span class="text-slate-300 font-medium">Aprox. ${l.duration}</span></div>
        </div>`;
    }).join('');
    return `<div class="fade-in"><header class="text-center mb-8"><h2 class="text-3xl font-bold text-white mb-2">Desplazamientos y Rutas</h2><p class="text-slate-400 text-sm max-w-xl mx-auto">Cálculo de distancias en tiempo real.</p></header><div class="space-y-4 max-w-3xl mx-auto">${cards}</div></div>`;
}

            <div class="p-6 flex-grow flex flex-col justify-between"><div><div class="flex items-start text-slate-300 mb-4"><span class="text-slate-400 mr-3 mt-0.5 flex-shrink-0">${ICO.building}</span><span class="text-sm" data-editable="reservations.${ri}.location">${esc(r.location)}</span></div><div class="flex flex-wrap gap-2 mb-3">${phonesHtml}${addPhoneBtn}</div>${emailHtml}${noteHtml}</div>${!editMode?'<div class="mt-4 text-right text-amber-400 text-xs font-semibold flex items-center justify-end">Clic para abrir en Maps <span class="ml-1">'+ICO.arrow+'</span></div>':''}</div></div>`;
    }).join('');
    let addBtn = editMode ? `<button class="btn-add" onclick="S.reservations.push({id:'r-'+uid(),date:'Fecha',time:'00:00',title:'Nueva reserva',location:'',note:'',phones:[],email:''}); saveToFirebase(); renderView()">${ICO.plus}<span class="mt-2 text-sm font-medium">Añadir reserva</span></button>` : '';
    return `<div class="fade-in"><header class="text-center mb-8"><h2 class="text-3xl font-bold text-white mb-2">Mis Reservas y Eventos</h2><p class="text-slate-400 text-sm max-w-xl mx-auto">Toca cualquier tarjeta para abrir la ubicación en Google Maps.</p></header><div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}${addBtn}</div></div>`;
}

/* ---------- ACCOMMODATIONS ---------- */
function viewAccom() {
    const cards = S.accommodations.map((h, hi) => {
        let delBtn = editMode ? `<button onclick="S.accommodations.splice(${hi},1); saveToFirebase(); renderView()" class="btn-icon btn-delete" title="Eliminar">${ICO.trash}</button>` : '';
        return `<div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden hover:bg-white/10 transition-colors shadow-lg fade-in"><div class="bg-purple-900/40 p-4 border-b border-white/5"><div class="flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-wider text-purple-300" data-editable="accommodations.${hi}.city">${esc(h.city)}</span>${delBtn}</div><h3 class="text-lg font-bold text-white mt-1" data-editable="accommodations.${hi}.name">${esc(h.name)}</h3></div><div class="p-6"><div class="flex items-center text-slate-300 mb-4"><span class="text-slate-400 mr-3">${ICO.building}</span><span data-editable="accommodations.${hi}.type">${esc(h.type)}</span></div><div class="flex items-center text-white font-medium"><span class="text-emerald-400 mr-3">${ICO.phone}</span>${editMode ? `<span data-editable="accommodations.${hi}.phone">${esc(h.phone)}</span>` : `<a href="tel:${esc(h.phone.replace(/ /g,''))}" class="hover:text-emerald-300 transition-colors">${esc(h.phone)}</a>`}</div></div></div>`;
    }).join('');
    let addBtn = editMode ? `<button class="btn-add" onclick="S.accommodations.push({id:'a-'+uid(),city:'Nueva ciudad',name:'Nuevo alojamiento',phone:'',type:'Hotel'}); saveToFirebase(); renderView()">${ICO.plus}<span class="mt-2 text-sm font-medium">Añadir alojamiento</span></button>` : '';
    return `<div class="fade-in"><header class="text-center mb-8"><h2 class="text-3xl font-bold text-white mb-2">Mis Alojamientos</h2><p class="text-slate-400 text-sm max-w-xl mx-auto">Información de contacto para tu llegada.</p></header><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards}${addBtn}</div></div>`;
}

/* ======================================================================
   EDIT MODE TOGGLE
   ====================================================================== */
function toggleEditMode() {
    editMode = !editMode;
    document.body.classList.toggle('edit-mode', editMode);
    document.getElementById('edit-banner').classList.toggle('hidden', !editMode);
    const btn = document.getElementById('btn-edit-toggle');

        btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/30';

    } else {
        btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-white/10';
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg><span class="hidden sm:inline">Editar</span>';
    }
    renderView();

/* ======================================================================
   HELPERS
   ====================================================================== */
function autolink(text) {
    if (!text) return '';
    const esc = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc.replace(/https?:\/\/[^\s,]+/gi, url => {
        const core = url.replace(/[.,;:]+$/, '');
        const rest = url.slice(core.length);
        return `<a href="${core}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="text-amber-300 underline">${core}</a>${rest}`;
    });
}

/* ======================================================================
   TRIP MANAGEMENT (multi-viaje)
   ====================================================================== */
function nextPlanDate() {
    const dates = S.travelPlan.map(t => t.date).filter(Boolean).sort();
    const t = getActiveTrip();
    if (!dates.length) return (t && t.startDate) || isoLocal(new Date());
    const d = new Date(dates[dates.length - 1] + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    return isoLocal(d);
}

function renderTripSelector() {
    const sel = document.getElementById('trip-select');
    if (!sel) return;
    sel.innerHTML = '';
    App.trips.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id;
        const fmt = dt => dt ? new Date(dt + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
        const dates = t.startDate && t.endDate ? ` (${fmt(t.startDate)} – ${fmt(t.endDate)})` : '';
        o.textContent = (t.data.config.title || 'Viaje') + dates;
        o.selected = t.id === App.activeTripId;
        sel.appendChild(o);
    });
    const del = document.getElementById('btn-del-trip');
    if (del) del.classList.toggle('hidden', !editMode || App.trips.length < 2);
}

function switchTrip(id) {
    if (id === App.activeTripId) return;
    App.activeTripId = id;
    applyActiveTrip();
    db.ref(ROOT + '/activeTripId').set(id);
    document.getElementById('nav-appname').textContent = S.config.appName || 'MiViaje';
    switchTab(activeTab);
}

function openNewTripModal() {
    const start = new Date();
    start.setDate(start.getDate() + 30);
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    document.getElementById('nt-name').value = '';
    document.getElementById('nt-start').value = isoLocal(start);
    document.getElementById('nt-end').value = isoLocal(end);
    document.getElementById('nt-error').classList.add('hidden');
    document.getElementById('newtrip-modal').classList.remove('hidden');
}

function closeNewTripModal() {
    document.getElementById('newtrip-modal').classList.add('hidden');
}

function showNtError(msg) {
    const el = document.getElementById('nt-error');
    el.textContent = msg;
    el.classList.remove('hidden');
}

function createNewTrip() {
    const name = document.getElementById('nt-name').value.trim() || 'Viaje sin nombre';
    const start = document.getElementById('nt-start').value;
    const end = document.getElementById('nt-end').value;
    if (!start || !end) { showNtError('Indica la fecha de inicio y la fecha de fin.'); return; }
    if (end < start) { showNtError('La fecha de fin no puede ser anterior a la de inicio.'); return; }
    const trip = { id: 'v-' + uid(), createdAt: new Date().toISOString(), startDate: start, endDate: end, data: defaultTripData(name, start, end) };
    closeNewTripModal();
    App.trips.push(trip);
    db.ref(ROOT).update({ ['trips/' + trip.id]: trip, activeTripId: trip.id });
    switchTrip(trip.id);
}

function deleteActiveTrip() {
    if (App.trips.length < 2) { alert('Debe quedar al menos un viaje guardado.'); return; }
    const t = getActiveTrip();
    if (!confirm(`¿Eliminar el viaje "${(t && t.data.config.title) || ''}"?\n\nEsta acción no se puede deshacer.`)) return;
    const next = App.trips.find(x => x.id !== App.activeTripId);
    db.ref(ROOT).update({ ['trips/' + App.activeTripId]: null, activeTripId: next.id });
}

/* ======================================================================
   EXPORTACIÓN A PDF (A4) — documento de impresión + window.print()
   En el diálogo del navegador elegir destino "Guardar como PDF".
   ====================================================================== */
let pdfPrevTitle = null;

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtLong(dt) {
    return new Date(dt + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
}

function showPdfToast(msg) {
    const el = document.getElementById('pdf-toast');
    el.textContent = msg;
    el.classList.remove('hidden');
}
function hidePdfToast() {
    document.getElementById('pdf-toast').classList.add('hidden');
}

function buildPrintDoc() {
    const t = getActiveTrip();
    const c = S.config || {};
    const rango = (t && t.startDate && t.endDate) ? `${fmtLong(t.startDate)} – ${fmtLong(t.endDate)}` : '';
    const generado = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });

    const cities = (c.itineraryText || '').split(' → ').filter(Boolean);

    const planRows = S.travelPlan.filter(d => d.date).map(d => {
        const dt = new Date(d.date + 'T00:00:00');
        return { f: dt.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }), w: dt.toLocaleDateString('es-ES', { weekday: 'long' }), l: d.location || '— sin asignar —' };
    });

    let totalKm = 0;
    const rutaRows = routeLegs.map(l => {
        const km = parseInt(l.distance, 10);
        if (!isNaN(km)) totalKm += km;
        return { from: l.from, to: l.to, d: l.distance, t: l.duration };
    });

    const climaRows = forecastData.filter(d => d.condition && d.condition !== 'Sin datos' && d.condition !== 'Fuera de alcance');

    const resHtml = S.reservations.map(r => `
        <div class="pdf-card">
            <h3>${esc(r.title)}</h3>
            <p class="pdf-line"><b>${esc(r.date)} · ${esc(r.time)}</b></p>
            ${r.location ? `<p class="pdf-line">Dirección: ${esc(r.location)}</p>` : ''}
            ${(r.phones && r.phones.length) ? `<p class="pdf-line">Tel.: ${(r.phones || []).map(esc).join(' · ')}</p>` : ''}
            ${r.email ? `<p class="pdf-line">Email: ${esc(r.email)}</p>` : ''}
            ${r.note ? `<div class="pdf-note">${esc(r.note)}</div>` : ''}
        </div>`).join('');

    const aloHtml = S.accommodations.map(h => `<tr><td>${esc(h.city)}</td><td><b>${esc(h.name)}</b></td><td>${esc(h.type)}</td><td>${esc(h.phone)}</td></tr>`).join('');

    let html = `
    <div class="pdf-meta"><span>${esc(c.appName || 'MiViaje')}</span><span>Generado el ${generado}</span></div>
    <h1><span class="pdf-label">Viaje:</span> ${esc(c.title || '')}</h1>
    <p class="pdf-sub">${esc(c.subtitle || '')}${rango ? ' · ' + rango : ''}</p>
    ${c.description ? `<p class="pdf-desc">${esc(c.description)}</p>` : ''}`;

    if (cities.length) html += `<h2>Itinerario</h2><p class="pdf-chain">${cities.map(esc).join(' &nbsp;→&nbsp; ')}</p>`;
    if (planRows.length) html += `<h2>Plan de viaje</h2><table><thead><tr><th style="width:18%">Fecha</th><th style="width:22%">Día</th><th>Localidad</th></tr></thead><tbody>${planRows.map(r => `<tr><td>${r.f}</td><td>${esc(r.w)}</td><td>${esc(r.l)}</td></tr>`).join('')}</tbody></table>`;
    if (rutaRows.length) html += `<h2>Desplazamientos</h2><table><thead><tr><th>Origen</th><th>Destino</th><th style="width:15%">Distancia</th><th style="width:15%">Duración</th></tr></thead><tbody>${rutaRows.map(r => `<tr><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.d)}</td><td>${esc(r.t)}</td></tr>`).join('')}</tbody></table><p class="pdf-total">Total aproximado: ${new Intl.NumberFormat('es-ES').format(totalKm)} km</p>`;
    if (climaRows.length) html += `<h2>Previsión del tiempo</h2><table><thead><tr><th>Fecha</th><th>Localidad</th><th>Estado</th><th style="width:9%">Mín</th><th style="width:9%">Máx</th><th style="width:12%">Lluvia</th><th style="width:15%">Viento</th></tr></thead><tbody>${climaRows.map(d => { const dt = new Date(d.date + 'T00:00:00'); return `<tr><td>${dt.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })}</td><td>${esc(d.location)}</td><td>${esc(d.condition)}</td><td>${d.min}°</td><td>${d.max}°</td><td>${d.pop}%</td><td>${esc(d.wind)}</td></tr>`; }).join('')}</tbody></table>`;
    if (S.reservations.length) html += `<h2>Reservas y eventos</h2>${resHtml}`;
    if (S.accommodations.length) html += `<h2>Alojamientos</h2><table><thead><tr><th style="width:16%">Ciudad</th><th>Alojamiento</th><th style="width:22%">Tipo</th><th style="width:22%">Teléfono</th></tr></thead><tbody>${aloHtml}</tbody></table>`;
    return html;
}

async function exportTripToPdf() {
    const stops = [];
    S.travelPlan.forEach(d => { if (d.location && stops[stops.length - 1] !== d.location) stops.push(d.location); });
    if (stops.length >= 2 && routeLegs.length === 0) {
        showPdfToast('Preparando el PDF: calculando rutas…');
        try { await fetchRoutes(); } catch (e) { console.error('Error calculando rutas para el PDF:', e); }
        hidePdfToast();
    }
    document.getElementById('print-root').innerHTML = buildPrintDoc();
    pdfPrevTitle = document.title;
    document.title = S.config.title || 'Viaje';
    setTimeout(() => window.print(), 150);
}

window.addEventListener('afterprint', function () {
    if (pdfPrevTitle !== null) { document.title = pdfPrevTitle; pdfPrevTitle = null; }
    hidePdfToast();
    document.getElementById('print-root').innerHTML = '';
});

function refreshLiveData() {
    weatherFetched = false; routesFetched = false;
    if (activeTab === 'weather') { weatherFetched = true; fetchWeather(); }
    if (activeTab === 'routes') { routesFetched = true; fetchRoutes(); }
}

function resetToDefaults() {
    const t = getActiveTrip();
    if (!confirm('¿Restaurar los datos de este viaje a sus valores originales?')) return;
    const nuevo = (t && t.source !== 'legacy' && (t.startDate || t.endDate))
        ? defaultTripData(t.data.config.title || 'Viaje', t.startDate, t.endDate)
        : normalizeTripData(JSON.parse(JSON.stringify(DEFAULTS)));
    if (t) t.data = nuevo;   // mantener coherente la caché local de viajes
    S = nuevo;
    weatherFetched = false; routesFetched = false;
    forecastData = []; routeLegs = [];
    saveToFirebase();
    renderTabs(); renderView();
}

function addNewLocation() {
    const name = prompt('Nombre de la nueva localidad:');
    if (!name) return;
    S.locations[name] = { lat: 40.4168, lon: -3.7038 };
    saveToFirebase(); renderView();
}

function locationDelete(city) {
    delete S.locations[city];
    // Los días del plan que apuntaban a esa localidad quedan sin asignar
    S.travelPlan.forEach(d => { if (d.location === city) d.location = ''; });
    saveToFirebase(); renderView();
}

function renameLocation(oldCity, newCity) {
    newCity = (newCity || '').trim();
    if (!newCity || newCity === oldCity) { renderView(); return; }
    if (S.locations[newCity]) { alert('Ya existe una localidad llamada "' + newCity + '".'); renderView(); return; }
    const coord = S.locations[oldCity];
    delete S.locations[oldCity];
    S.locations[newCity] = coord;
    S.travelPlan.forEach(d => { if (d.location === oldCity) d.location = newCity; });
    saveToFirebase(); renderView();
}

/* ======================================================================
   TEMA DÍA/NOCHE (automático según el esquema del dispositivo)
   ====================================================================== */
function applyTheme() {
    const dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.classList.toggle('light-mode', !dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f1f5f9');
}
const themeMq = window.matchMedia('(prefers-color-scheme: light)');
if (themeMq.addEventListener) themeMq.addEventListener('change', applyTheme);
else if (themeMq.addListener) themeMq.addListener(applyTheme);
applyTheme();

/* ======================================================================
   INIT
   ====================================================================== */
function startApp() {
    loadFromFirebase(() => {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('nav-appname').textContent = S.config.appName || 'MiViaje';
        renderTabs();
        renderView();
        if (activeTab === 'weather' && !weatherFetched) { weatherFetched = true; fetchWeather(); }
        if (activeTab === 'routes' && !routesFetched) { routesFetched = true; fetchRoutes(); }
    });
    // Sin conexión con Firebase: aviso claro en la pantalla de carga
    setTimeout(function () {
        const ls = document.getElementById('loading-screen');
        const lt = document.getElementById('loading-text');
        if (ls && ls.style.display !== 'none' && lt && !lt.textContent.includes('⚠')) {
            lt.innerHTML = '⚠ Sin conexión con Firebase.<br><span class="text-xs">La app necesita internet para cargar y guardar los viajes. Reinténtalo al recuperar la conexión.</span>';
        }
    }, 10000);
}

// Autenticación anónima: permite que las reglas de Firebase exijan usuario
// autenticado para leer/escribir los datos de los viajes (ver REGLAS-FIREBASE.md).
let appStarted = false;
function tryStart() {
    if (appStarted) return;
    appStarted = true;
    startApp();
}
firebase.auth().onAuthStateChanged(function (user) {
    if (user) tryStart();
});
firebase.auth().signInAnonymously().catch(function (err) {
    // Si el proveedor anónimo no está activo aún, la app funciona igual bajo las reglas actuales
    console.warn('Autenticación anónima no disponible (' + ((err && err.code) || err) + '); continuando sin autenticar.');
    tryStart();
});
setTimeout(tryStart, 4000);

// Service Worker (PWA): instala la app y habilita el uso de la interfaz sin conexión
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
            console.warn('Service Worker no registrado:', err);
        });
    });
}
</script>
